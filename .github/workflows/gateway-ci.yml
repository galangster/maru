# The gateway's cross-platform proof, as far as CI can carry it (P9): the
# TypeScript suites on Linux and Windows, and the Rust relay compiled and
# tested on Linux (Windows compiles it in windows-build.yml). The unix-socket
# live suites self-skip on Windows; the hand-smoke owner gate stays for what
# no runner can check — a human on the other end of a real pipe.

name: gateway-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run poses:check
      - run: npm test

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
