name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # createUpdaterArtifacts is on (P3), so the build needs the updater
      # signing key or it fails producing the .sig files. The password is
      # explicitly empty — the key has none, and the CLI treats an unset
      # password variable differently from an empty one.
      - name: Build Windows bundles (NSIS + MSI)
        run: npx tauri build
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: maru-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # macOS build, same shape — enable when needed.
