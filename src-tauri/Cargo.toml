[package]
name = "wren"
version = "0.1.9"
description = "Maru mail app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# std's TcpListener cannot bound an accept(); socket2 sets SO_RCVTIMEO on the
# listening socket so the OAuth wait blocks instead of polling.
socket2 = "0.6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
interprocess = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSResponder", "NSToolbar", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-maru-auth = { path = "plugins/maru-auth" }
tauri-plugin-maru-shell = { path = "plugins/maru-shell" }
tauri-plugin-maru-push = { path = "plugins/maru-push" }
# The iOS keychain default is `WhenUnlocked`, which a push-woken background
# fetch after a reboot cannot read. These write the items directly so the
# accessibility attribute can be set. See `ios_keychain.rs`.
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.17"
